# ci.yml - Tylin's lane
# Every gate runs BARE. No pipe on the exit path. A skipped test is a false green.
# The eval gate is Stephen's separate eval-gate.yml and must not appear here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # em-dash: hard rule, runs on every push, no scaffold dependency
  # -------------------------------------------------------------------------
  em-dash:
    name: No em-dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check for em-dashes
        run: uv run --python 3.12 python scripts/no_em_dash.py --check

  # -------------------------------------------------------------------------
  # gitleaks: secret scan over full history
  # -------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # license-guard: fail if forbidden EPL/GPL packages appear in lockfiles
  # -------------------------------------------------------------------------
  license-guard:
    name: Permissive license guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if elkjs or orbdetpy appear
        run: |
          found=0
          for f in package.json pipeline/pyproject.toml; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing"
              exit 1
            fi
          done
          for f in package.json package-lock.json pipeline/pyproject.toml pipeline/uv.lock; do
            if [ ! -f "$f" ]; then
              continue
            fi
            if grep -E -q 'elkjs|orbdetpy' "$f"; then
              echo "::error::Forbidden package in $f (elkjs EPL/GPL or orbdetpy GPL-3.0)"
              grep -n -E 'elkjs|orbdetpy' "$f"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "elkjs and orbdetpy absent from declared deps and lockfiles"

  # -------------------------------------------------------------------------
  # lint, typecheck, tests, build: always run. A skipped gate is a false green.
  # -------------------------------------------------------------------------
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test-engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run engine tests
        run: npm run test:engine

  corpus-bundle:
    name: Frozen corpus bundle present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require sqlite vectors and schema
        run: |
          test -f corpus/manifest.sqlite
          test -f corpus/vectors.f32
          test -f corpus/schema.json

  test-ask:
    name: Ask-route tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ask tests
        run: npm run test:ask

  # NOAA parser unit tests in services/solar. LIVE_TESTS is unset so the
  # live NOAA it.skipIf cases stay skipped. The unit cases (hyphenated
  # time-tag, observed array shape) must run or a parser regression is a
  # false green. Route tests already run under test:ask (app/api).
  test-solar:
    name: Solar service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run solar service tests
        run: npx vitest run services/solar

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
