# eval-gate.yml - Stephen's lane (tasks 1.5 and 3.1). Never merged into ci.yml.
#
# Runs the 28+6 eval bank against committed fixtures: no network, no key.
# This tests retrieval scoring, citation extraction, and abstention logic
# deterministically on every push.
#
# THRESHOLD POLICY, stated honestly:
#   The submission bar (CLAUDE.md section 5) is 90 percent with exact
#   citations and all 6 traps abstaining. The current extractive,
#   hashing-trick baseline measures 53.6 percent (2026-08-24, fixtures
#   recorded from that run). The CI ratchet below fails on any REGRESSION
#   from the recorded baseline and on any trap answering; the 90 percent
#   bar is enforced at the Phase 4 freeze gate once watsonx embeddings and
#   generation land (task 0.13 credentials). Raise RATCHET_MIN_SCORE
#   whenever the recorded fixtures improve. Do not lower it.
#
# Every gate runs BARE: no pipe on the exit path. A missing fixture FAILS
# inside the runner, never skips.

name: Eval gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  RATCHET_MIN_SCORE: "46.4"

jobs:
  eval-fixtures:
    name: Eval bank against committed fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the baseline itself was not lowered
        env:
          # Event boundary, not HEAD^: a multi-commit push must compare
          # against the pre-push tip, or a mid-push commit could lower the
          # baseline invisibly. Zero-SHA means branch creation.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess, sys
          current = set(json.load(open("eval/baseline_passing.json"))["passing"])
          base = os.environ.get("BASE_SHA") or ""
          if not base or set(base) == {"0"}:
              print("no event base (branch creation or manual dispatch): comparing against HEAD^")
              base = "HEAD^"
          exists = subprocess.run(
              ["git", "cat-file", "-e", f"{base}:eval/baseline_passing.json"],
              capture_output=True,
          )
          if exists.returncode != 0:
              # Fail closed unless the absence is positively verified: the
              # BASE COMMIT must exist; only the FILE may be absent.
              commit_ok = subprocess.run(
                  ["git", "cat-file", "-e", f"{base}^{{commit}}"], capture_output=True,
              )
              if commit_ok.returncode != 0:
                  print(f"::error::base commit {base} unreadable; failing closed")
                  sys.exit(1)
              print(f"baseline file absent at {base}: first introduction, ok")
              sys.exit(0)
          proc = subprocess.run(
              ["git", "show", f"{base}:eval/baseline_passing.json"],
              capture_output=True, text=True,
          )
          if proc.returncode != 0:
              print(f"::error::could not read baseline at {base}; failing closed")
              sys.exit(1)
          parent = set(json.loads(proc.stdout)["passing"])
          removed = sorted(parent - current)
          # Raise-only, with one narrow escape: RETRACTION. A row whose check
          # could never fail was never a pass, and leaving its id here would
          # make the regression gate below fail forever once the row is gone.
          # Both halves are required, so a hard question cannot be quietly
          # deleted to lift the number: the id must be ABSENT from the bank,
          # and it must be listed in `retracted` with a non-empty reason.
          if removed:
              doc = json.load(open("eval/baseline_passing.json"))
              retracted = {
                  r["id"]: (r.get("reason") or "").strip()
                  for r in doc.get("retracted", [])
              }
              bank_ids = {
                  json.loads(line)["id"]
                  for line in open("eval/bank.jsonl")
                  if line.strip()
              }
              unexplained = [i for i in removed if not retracted.get(i)]
              still_in_bank = [i for i in removed if i in bank_ids]
              if unexplained:
                  print(f"::error::baseline ids REMOVED with no retraction reason: {unexplained}")
                  sys.exit(1)
              if still_in_bank:
                  print(f"::error::retracted ids are still scored in the bank: {still_in_bank}")
                  sys.exit(1)
              print(f"ok: {len(removed)} retracted id(s), each absent from the bank and explained: {removed}")
          print(f"ok: baseline is a superset of {base} ({len(parent)} -> {len(current)} ids)")
          PY

      - name: Matcher metadata regression tests (stdlib, round 4)
        run: python3 pipeline/tests/test_runner_matcher.py

      - name: Run eval bank (fixtures, offline)
        run: python3 eval/runner.py --mode fixtures --min-score "$RATCHET_MIN_SCORE"

      - name: Assert every bank row was scored, none skipped
        run: |
          python3 - << 'PY'
          import json, sys
          report = json.load(open("eval/report.json"))
          bank_rows = sum(1 for line in open("eval/bank.jsonl") if line.strip())
          scored = len(report["results"])
          if scored != bank_rows:
              print(f"::error::guard skipped: {scored} scored of {bank_rows} bank rows")
              sys.exit(1)
          if report["traps"] != report["traps_abstained"]:
              print("::error::an abstention trap answered")
              sys.exit(1)
          print(f"ok: {scored} rows scored, score {report['score_pct']}%, "
                f"traps {report['traps_abstained']}/{report['traps']}")
          PY

      - name: Assert no previously-passing id regressed
        run: |
          python3 - << 'PY'
          import json, sys
          report = json.load(open("eval/report.json"))
          baseline = json.load(open("eval/baseline_passing.json"))
          passing_now = {r["id"] for r in report["results"] if r["pass"]}
          regressed = sorted(set(baseline["passing"]) - passing_now)
          if regressed:
              print(f"::error::previously-passing ids regressed: {regressed}")
              sys.exit(1)
          print(f"ok: all {len(baseline['passing'])} baseline ids still pass")
          PY

  # ---------------------------------------------------------------------------
  # anti-fabrication guard (task 2.18)
  #
  # This suite existed for weeks and had NEVER RUN IN CI: no workflow ran
  # pytest at all. In that gap README.md and JUDGE.md both drifted to "79
  # engine and mobile tests" while the suite really ran 81 and FACTS.json
  # correctly said 81. A guard nobody executes is decoration.
  #
  # Every step below runs BARE, with no pipe on its exit path, and the
  # dependency install is a hard failure rather than a skip: a guard that
  # cannot run must go red, never green-by-absence.
  # ---------------------------------------------------------------------------
  fabricated-numbers:
    name: Every judge-facing number traces to FACTS.json
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because tests/test_engineering_log.py resolves every
      # commit SHA the engineering log cites, and the default shallow
      # checkout contains exactly one commit. Without full history the
      # guard reports every real citation as dead, which is a true failure
      # for a false reason. The guard tells the two apart and names this
      # line when the history is the problem.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Node is required, not optional. scripts/facts.py measures test counts by
      # RUNNING vitest. Without node the measurement fails, facts.py prints a
      # warning, skips that half of the check and still exits 0. The first run
      # of this job did exactly that: "WARNING: vitest failed ... test counts
      # omitted" immediately followed by "OK: docs/FACTS.json is current", which
      # is a green check reporting on a comparison it never made. That is the
      # conditionally-skipped guard, inside the guard added to prevent it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies so the counts can actually be measured
        run: npm ci

      - name: Assert the guard suite is present before trusting a pass
        run: test -f tests/test_no_fabricated_numbers.py

      - name: README and JUDGE.md counts equal the measured counts
        run: uv run --python 3.12 --with pytest python -m pytest tests/ -v

      - name: FACTS.json is not stale against the code that generates it
        run: uv run --python 3.12 python scripts/facts.py --check
