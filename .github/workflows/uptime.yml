# uptime.yml - Tylin's lane
# Content-check the deployed URL. A warm instance that lost its corpus still
# returns HTTP 200, so status-code-only is a false green (CI rule 8).
# Offset minutes. Never */N and never :00.
#
# Required repo variable (set when Khadim's 1.17 URL exists):
#   MANIFEST_DEPLOY_URL   e.g. https://manifest-web-roan.vercel.app
# If unset, this job FAILS. A skipped watchdog is a false green.

name: Uptime

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

jobs:
  content-check:
    name: Content-check /api/status and /api/ask
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy URL
        env:
          URL: ${{ vars.MANIFEST_DEPLOY_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::MANIFEST_DEPLOY_URL is not set. Uptime cannot skip. Set the repo variable after task 1.17."
            exit 1
          fi

      - name: Fetch /api/status
        env:
          URL: ${{ vars.MANIFEST_DEPLOY_URL }}
        run: |
          code=$(curl -sS -o /tmp/status.json -w "%{http_code}" "$URL/api/status")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200 from /api/status, got $code"
            exit 1
          fi

      - name: Assert headline fields exist
        run: |
          python3 - << 'PY'
          import json, sys
          with open("/tmp/status.json") as f:
              data = json.load(f)
          if "deadline_violations_days" not in data:
              print("::error::deadline_violations_days missing. Body is not the status payload.")
              sys.exit(1)
          days = data["deadline_violations_days"]
          if not isinstance(days, (int, float)):
              print("::error::deadline_violations_days is not numeric:", days)
              sys.exit(1)
          if "models" not in data:
              print("::error::models inventory missing")
              sys.exit(1)
          print("deadline_violations_days=", days)
          print("models=", data["models"])
          PY

      # The probe is eval bank q03, VERBATIM, and q03 is listed in
      # eval/baseline_passing.json. That matters: the watchdog asks a question
      # the eval already scores this product as able to answer, rather than one
      # chosen because it happens to pass.
      #
      # It previously asked "What is the 97.207(g) dual-clock deadline?".
      # On 2026-08-30, with watsonx restored and the pipeline genuinely live,
      # that question returned `Guardian audit: ASSISTANTFAIL` on four
      # consecutive runs: Guardian rejects the generated answer as ungrounded
      # and the product correctly fails closed. The watchdog demands
      # abstained=false, so it stayed red while nothing was wrong.
      #
      # Be clear about what this change is and is not. It is NOT tuning a probe
      # until the light turns green: the assertions below are unchanged and
      # still require a Guardian-audited, non-degraded answer carrying the
      # exact 97.207(g)(1) citation. It is fixing a probe that asserted a
      # failure which was not one, because a question the product legitimately
      # declines measures Guardian's strictness rather than whether the
      # generative path is alive. q03 was verified stable across four
      # consecutive production runs before this swap.
      - name: POST /api/ask, eval bank q03
        env:
          URL: ${{ vars.MANIFEST_DEPLOY_URL }}
        run: |
          code=$(curl -sS -o /tmp/ask.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"question":"Under 47 CFR 97.207(g), within how many days after launch-vehicle determination must a pre-space notification be filed?"}' \
            "$URL/api/ask")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200 from /api/ask, got $code. 503 means corpus gone."
            exit 1
          fi

      - name: Assert 97.207(g)(1) citation
        run: |
          python3 - << 'PY'
          import json, sys
          with open("/tmp/ask.json") as f:
              data = json.load(f)
          if data.get("abstained") is not False:
              print("::error::abstained must be false. Body:", data)
              sys.exit(1)
          cites = data.get("citations") or []
          ok = False
          for c in cites:
              section = str(c.get("section") or "")
              path = str(c.get("paragraphPath") or "")
              combined = (section + path).replace(" ", "")
              if "97.207" in combined and "(g)(1)" in combined:
                  ok = True
                  break
          if not ok:
              print("::error::no citation covering 97.207(g)(1). citations=", cites)
              sys.exit(1)
          print("ok citations", cites)
          PY

      # Added 2026-08-29. Before this, /api/ask returned the raw watsonx
      # exception when watsonx was unreachable, so the step above caught a
      # generative outage as a side effect of the answer vanishing. It now
      # degrades to the extractive path and still answers with citations,
      # which is the right product behaviour and would have left this
      # watchdog GREEN over a completely dead Granite path. Availability and
      # degradation are different questions, so they are asserted separately.
      - name: Assert the answer came from watsonx, not the degraded fallback
        run: |
          python3 - << 'PY'
          import json, sys
          with open("/tmp/ask.json") as f:
              data = json.load(f)
          if data.get("degraded") is True:
              print("::error::watsonx is configured but unreachable. The product is "
                    "SERVING, degraded to the offline extractive path, and answering "
                    "with citations. Generation and the Guardian audit are NOT running. "
                    "Upstream reason:", data.get("reason"))
              sys.exit(1)
          # degraded=false alone is not proof watsonx answered: the KEYLESS
          # extractive path also reports degraded=false, by design, because
          # nothing degraded. Only a Guardian-audited answer proves the
          # generative pipeline ran, so assert that too or a deployment that
          # simply lost its credentials would print "watsonx answered".
          if data.get("audited") is not True:
              print("::error::answer was not Guardian-audited, so the watsonx pipeline "
                    "did not produce it. Most likely WATSONX_API_KEY and "
                    "WATSONX_PROJECT_ID are missing from this deployment. Body:", data)
              sys.exit(1)
          print("not degraded and Guardian-audited. watsonx answered.")
          PY
